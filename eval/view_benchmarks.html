<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>benchmarks.json viewer</title>
<style>
  :root {
    --bg:        #0f1117;
    --panel:    #161a23;
    --panel-2:  #1c212d;
    --border:   #2a313f;
    --text:     #d6dae3;
    --muted:    #8a93a6;
    --accent:   #6ea8fe;
    --accent-2: #8ef0c2;
    --code-bg:  #11141d;
    --warn:     #ffb86b;
    --ok:       #8ef0c2;
    --bad:      #ff7b9c;
    --mono: 'JetBrains Mono', 'SF Mono', 'Fira Code', Consolas, Menlo, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: var(--sans); font-size: 14px;
  }
  body { display: flex; flex-direction: column; }

  .topbar {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 16px; border-bottom: 1px solid var(--border);
    background: var(--panel);
  }
  .topbar h1 {
    margin: 0; font-size: 14px; font-weight: 600; color: var(--accent);
  }
  .topbar input[type=file] {
    color: var(--text); background: var(--panel-2);
    border: 1px solid var(--border); border-radius: 4px;
    padding: 4px 8px;
  }
  .topbar .meta { color: var(--muted); margin-left: auto; font-size: 12px; }
  .topbar button {
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 4px;
    padding: 4px 10px; font-size: 12px; cursor: pointer;
  }
  .topbar button:hover { border-color: var(--accent); }

  .layout { flex: 1; display: flex; min-height: 0; }
  .sidebar {
    width: 260px;
    min-width: 160px;
    flex-shrink: 0;
    overflow-y: auto; background: var(--panel);
  }
  .resizer {
    width: 4px;
    cursor: col-resize;
    background: var(--border);
    flex-shrink: 0;
    user-select: none;
    transition: background 80ms;
  }
  .resizer:hover, .resizer.dragging { background: var(--accent); }
  body.resizing { cursor: col-resize; user-select: none; }
  body.resizing iframe, body.resizing pre { pointer-events: none; }
  .sidebar input[type=search] {
    width: calc(100% - 16px); margin: 8px;
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 4px;
    padding: 4px 8px;
  }
  .sidebar ul { list-style: none; margin: 0; padding: 0 0 16px 0; }
  .sidebar li {
    padding: 8px 12px; cursor: pointer;
    border-bottom: 1px solid var(--border);
    display: flex; gap: 8px; align-items: baseline;
  }
  .sidebar li:hover { background: var(--panel-2); }
  .sidebar li.active { background: var(--panel-2); border-left: 3px solid var(--accent); padding-left: 9px; }
  .sidebar .pid { color: var(--accent); font-family: var(--mono); font-size: 12px; }
  .sidebar .pname { color: var(--text); font-size: 13px; flex: 1; }
  .sidebar .pname.has-checker::after {
    content: " ✓"; color: var(--ok); font-size: 11px;
  }
  .badge {
    font-family: var(--mono); font-size: 10px;
    padding: 1px 6px; border-radius: 3px; margin-left: 4px;
    border: 1px solid; line-height: 1.4;
  }
  .badge.byte-det   { color: var(--accent-2); border-color: var(--accent-2); }
  .badge.checker    { color: var(--warn);     border-color: var(--warn); }

  .badge-large {
    font-family: var(--mono); font-size: 12px;
    padding: 3px 10px; border-radius: 4px; margin-left: 8px;
    border: 1px solid; vertical-align: middle;
  }
  .badge-large.byte-det   { color: var(--accent-2); border-color: var(--accent-2); }
  .badge-large.checker    { color: var(--warn);     border-color: var(--warn); }

  .main {
    flex: 1; overflow-y: auto; padding: 16px 24px;
    background: var(--bg);
  }
  .main h2 {
    margin: 0 0 4px 0; font-size: 18px; color: var(--accent);
    font-family: var(--mono);
  }
  .main .name { color: var(--text); font-size: 14px; margin-bottom: 16px; }
  .main .description {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 6px; padding: 12px 14px; margin-bottom: 16px;
    white-space: pre-wrap; line-height: 1.5; color: var(--text);
  }

  .section {
    margin-bottom: 18px; border: 1px solid var(--border); border-radius: 6px;
    background: var(--panel); overflow: hidden;
  }
  .section header {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 12px; background: var(--panel-2);
    border-bottom: 1px solid var(--border);
    cursor: pointer; user-select: none;
  }
  .section header h3 {
    margin: 0; font-size: 13px; font-weight: 600;
    color: var(--accent-2); flex: 1;
  }
  .section header .lang {
    font-family: var(--mono); font-size: 11px; color: var(--muted);
    background: var(--bg); padding: 2px 6px; border-radius: 3px;
    border: 1px solid var(--border);
  }
  .section header .args {
    font-family: var(--mono); font-size: 11px; color: var(--muted);
  }
  .section header .toggle { color: var(--muted); font-size: 12px; }
  .section .body { display: block; }
  .section.collapsed .body { display: none; }
  .section.collapsed header .toggle::before { content: "▸"; }
  .section:not(.collapsed) header .toggle::before { content: "▾"; }

  pre.code {
    margin: 0; padding: 12px 14px; overflow-x: auto;
    background: var(--code-bg); color: var(--text);
    font-family: var(--mono); font-size: 12.5px; line-height: 1.5;
    white-space: pre;
  }
  pre.code .ln {
    color: var(--muted); margin-right: 12px;
    user-select: none; display: inline-block; min-width: 32px;
    text-align: right;
  }

  .empty {
    padding: 8px 14px; color: var(--muted); font-style: italic;
  }

  .placeholder {
    margin: 80px auto; max-width: 480px; text-align: center; color: var(--muted);
  }
  .placeholder code {
    font-family: var(--mono); color: var(--accent);
    background: var(--panel); padding: 2px 6px; border-radius: 3px;
  }
</style>
</head>
<body>

<div class="topbar">
  <h1>benchmarks.json viewer</h1>
  <input type="file" id="file" accept=".json">
  <button id="loadDefault">Load benchmarks.json (sibling)</button>
  <span class="meta" id="meta"></span>
</div>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <input type="search" id="filter" placeholder="filter…">
    <ul id="problemList"></ul>
  </aside>
  <div class="resizer" id="resizer" title="drag to resize"></div>
  <main class="main" id="detail">
    <div class="placeholder">
      <p>Pick a <code>benchmarks.json</code> via the file input,<br>
      or click <em>Load benchmarks.json (sibling)</em> if this file is served
      next to one.</p>
    </div>
  </main>
</div>

<script>
let DATA = null;
let CURRENT_PID = null;

function $(sel) { return document.querySelector(sel); }
function $$(sel) { return [...document.querySelectorAll(sel)]; }

function setMeta(text) { $('#meta').textContent = text; }

function renderSidebar(filter='') {
  const ul = $('#problemList');
  ul.innerHTML = '';
  if (!DATA || !DATA.problems) return;
  const f = filter.trim().toLowerCase();
  const ids = Object.keys(DATA.problems).sort();
  for (const pid of ids) {
    const p = DATA.problems[pid];
    const name = p.name || '(no name)';
    if (f && !(pid + ' ' + name).toLowerCase().includes(f)) continue;
    const li = document.createElement('li');
    li.className = (pid === CURRENT_PID) ? 'active' : '';
    li.dataset.pid = pid;
    const pidSpan = document.createElement('span');
    pidSpan.className = 'pid'; pidSpan.textContent = pid;
    const nameSpan = document.createElement('span');
    nameSpan.className = 'pname' + (p.checker ? ' has-checker' : '');
    nameSpan.textContent = name;
    const byteDet = (p.byte_deterministic !== false);  // default true
    const badge = document.createElement('span');
    badge.className = 'badge ' + (byteDet ? 'byte-det' : 'checker');
    badge.textContent = byteDet ? 'byte' : 'checker';
    li.appendChild(pidSpan);
    li.appendChild(nameSpan);
    li.appendChild(badge);
    li.addEventListener('click', () => { CURRENT_PID = pid; renderSidebar(filter); renderDetail(pid); });
    ul.appendChild(li);
  }
}

function codeBlockHTML(code) {
  if (!code) return '<div class="empty">(empty)</div>';
  const lines = code.replace(/\r\n/g, '\n').split('\n');
  const escaped = lines.map((ln, i) => {
    const num = String(i + 1).padStart(3, ' ');
    const safe = ln.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    return `<span class="ln">${num}</span>${safe}`;
  }).join('\n');
  return `<pre class="code">${escaped}</pre>`;
}

function sectionHTML(title, language, extraHeaderHTML, code, defaultCollapsed=false) {
  const langTag = language ? `<span class="lang">${language}</span>` : '';
  const collapsed = defaultCollapsed ? ' collapsed' : '';
  return `
    <section class="section${collapsed}">
      <header>
        <h3>${title}</h3>
        ${langTag}
        ${extraHeaderHTML || ''}
        <span class="toggle"></span>
      </header>
      <div class="body">${codeBlockHTML(code)}</div>
    </section>
  `;
}

function renderDetail(pid) {
  const p = DATA.problems[pid];
  if (!p) { $('#detail').innerHTML = `<div class="placeholder">no problem ${pid}</div>`; return; }
  const ref  = p.reference || {};
  const gi   = p.gen_input || {};
  const chk  = p.checker || null;
  const args = (gi.default_args || []).join(' ');
  const argsHTML = args ? `<span class="args">args: ${args.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')}</span>` : '';

  const byteDet = (p.byte_deterministic !== false);
  const stypeBadge = byteDet
    ? `<span class="badge-large byte-det">byte-deterministic — bytes match for any correct impl</span>`
    : `<span class="badge-large checker">checker-required — bytes may differ (tolerance / multi-valid)</span>`;
  let html = '';
  html += `<h2>${pid}${stypeBadge}</h2>`;
  html += `<div class="name">${(p.name || '(no name)').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')}</div>`;
  const desc = (p.description || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  html += `<div class="description">${desc}</div>`;
  html += sectionHTML('Reference (serial)',  ref.language || '?', '', ref.code || '', false);
  html += sectionHTML('gen_input',           gi.language  || '?', argsHTML, gi.code || '', false);
  if (chk) {
    html += sectionHTML('Checker',           chk.language || '?', '', chk.code || '', true);
  } else {
    html += `<section class="section"><header><h3>Checker</h3><span class="toggle"></span></header><div class="body"><div class="empty">no checker (uses byte-equal / LLM-judge fallback)</div></div></section>`;
  }
  $('#detail').innerHTML = html;

  // wire up section collapse toggles
  $$('#detail .section header').forEach(h => {
    h.addEventListener('click', () => {
      h.parentElement.classList.toggle('collapsed');
    });
  });
}

function loadJSON(text) {
  try {
    DATA = JSON.parse(text);
  } catch (e) {
    alert('Invalid JSON: ' + e.message);
    return;
  }
  if (!DATA.problems) {
    alert('JSON has no "problems" key — wrong file?');
    return;
  }
  CURRENT_PID = Object.keys(DATA.problems).sort()[0];
  setMeta(`${Object.keys(DATA.problems).length} problems`);
  renderSidebar();
  renderDetail(CURRENT_PID);
}

// File picker
$('#file').addEventListener('change', async (e) => {
  const f = e.target.files[0];
  if (!f) return;
  const text = await f.text();
  loadJSON(text);
});

// Default-load button (works only if served via http)
$('#loadDefault').addEventListener('click', async () => {
  try {
    const resp = await fetch('benchmarks.json');
    if (!resp.ok) throw new Error(resp.statusText);
    loadJSON(await resp.text());
  } catch (e) {
    alert('Could not fetch benchmarks.json (likely needs an http server, '
        + 'or use the file picker above). ' + e.message);
  }
});

// Filter
$('#filter').addEventListener('input', e => renderSidebar(e.target.value));

// Sidebar resizer (drag to set width; persisted in localStorage)
(function setupResizer() {
  const sidebar = document.getElementById('sidebar');
  const resizer = document.getElementById('resizer');
  const MIN_W = 160, MAX_W = 720;

  // restore saved width
  const saved = parseInt(localStorage.getItem('sidebar_width') || '', 10);
  if (saved && saved >= MIN_W && saved <= MAX_W) sidebar.style.width = saved + 'px';

  let dragging = false;
  resizer.addEventListener('mousedown', (e) => {
    dragging = true;
    resizer.classList.add('dragging');
    document.body.classList.add('resizing');
    e.preventDefault();
  });
  window.addEventListener('mousemove', (e) => {
    if (!dragging) return;
    const rect = sidebar.getBoundingClientRect();
    const w = Math.min(Math.max(e.clientX - rect.left, MIN_W), MAX_W);
    sidebar.style.width = w + 'px';
  });
  window.addEventListener('mouseup', () => {
    if (!dragging) return;
    dragging = false;
    resizer.classList.remove('dragging');
    document.body.classList.remove('resizing');
    localStorage.setItem('sidebar_width', parseInt(sidebar.style.width, 10));
  });

  // Double-click resizer to reset
  resizer.addEventListener('dblclick', () => {
    sidebar.style.width = '260px';
    localStorage.setItem('sidebar_width', '260');
  });
})();

// Auto-load via fetch on first load (silent failure ok)
(async () => {
  try {
    const resp = await fetch('benchmarks.json');
    if (resp.ok) loadJSON(await resp.text());
  } catch (e) { /* ignore — user will use file picker */ }
})();
</script>
</body>
</html>
