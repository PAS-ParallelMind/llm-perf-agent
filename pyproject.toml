[project]
name = "llm-perf-agent"
version = "0.1.0"
description = "Interactive chat agent for LLM inference deployment guidance and performance analysis. OpenAI-compatible tool-calling against any vLLM backend."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.40.0",
    "pyyaml>=6.0",
    "rich>=13.7.0",
    "pandas>=2.0",
    "huggingface-hub>=1.12.0",
]

[tool.uv]
package = false
